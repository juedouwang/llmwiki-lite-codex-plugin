const root=document.getElementById('research-git-workbench');
const $=s=>root.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const capture=file('src/capture.py',8,3,['  def open_camera(config):','-   camera.set_auto(True)','+   camera.set_auto(False)','+   camera.set_exposure(','+       config.exposure_ms','+   )','    return camera']);
const roi=file('src/tracking/roi_tracker.py',18,6,['  def track(frame, roi):','-   points = detect(frame)','+   crop = frame[roi]','+   points = detect(crop)','+   points = stabilize(points)','    return points']);

let commits=[
{id:'b73a19d',lane:0,title:'完善缺陷结果导出',parents:['92af684'],time:'18:20',files:[file('src/export.py',24,5,['  def export(results):','-   save(results)','+   save_csv(results)','+   save_preview(results)'])]},
{id:'c42e801',lane:1,title:'验证低纹理区域跟踪',parents:['63cb1a2'],time:'17:35',files:[roi,note]},
{id:'92af684',lane:0,title:'修正标定参数读取',parents:['a8f21c9'],time:'16:42',files:[camera,capture]},
{id:'63cb1a2',lane:1,title:'加入 ROI 稳定性实验',parents:['a8f21c9'],time:'15:10',files:[roi]},
{id:'a8f21c9',lane:0,title:'完成相机采集与标定',parents:['f17c403'],time:'昨天',files:[camera,capture]},
{id:'f17c403',lane:0,title:'建立缺陷检测基线',parents:[],time:'周四',files:[file('README.md',16,0,['+ # 电缆表面缺陷检测','+ 相机采集 → 标定 → 缺陷检测'])]}
];

const design={detailPlacement:'side',density:'comfortable'};
const initial=null;
function acceptState(s){const p=s&&s.privateContent;if(!p)return;if(p.detailPlacement==='side'||p.detailPlacement==='bottom')design.detailPlacement=p.detailPlacement;if(p.density==='compact'||p.density==='comfortable')design.density=p.density;if(commits.some(c=>c.id===p.selected))selected=p.selected;}
acceptState(initial);
function remember(action){root.dispatchEvent(new CustomEvent('rw-git-action',{bubbles:true,detail:{action}}));}

function idsFrom(head){const seen=new Set();const visit=id=>{if(!id||seen.has(id))return;seen.add(id);const c=commits.find(x=>x.id===id);if(c)c.parents.forEach(visit);};visit(head);return seen;}
function ahead(){const local=idsFrom(branches[branch]),remote=idsFrom(remotes[branch]);return [...local].filter(id=>!remote.has(id)).length;}
function defaultStatus(){const n=ahead();return branch+' · '+(n?n+' 个本地版本待上传':'已与远程同步');}
function setStatus(message){statusMessage=message;$('#rg-status').textContent=message;}
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
function render(){
root.dataset.detail=design.detailPlacement;root.dataset.density=design.density;
$('#rg-branch-label').textContent=branch;$('#rg-push-count').textContent=ahead();$('#rg-push-count').hidden=!ahead();
$('#rg-change-text').innerHTML=dirty.length?dirty.length+' 个文件有改动<small>尚未保存为版本</small>':'所有修改已保存<small>工作区干净，可以切换分支或合并</small>';
$('#rg-save-button').hidden=!dirty.length;
$('#rg-status').textContent=statusMessage||defaultStatus();
const rowHeight=design.density==='compact'?58:68;
const position=new Map(commits.map((c,i)=>[c.id,{x:c.lane?49:20,y:i*rowHeight+rowHeight/2}]));
let paths='';
commits.forEach(c=>{const a=position.get(c.id);c.parents.forEach(pid=>{const b=position.get(pid);if(!b)return;const color=c.lane?'var(--rg-purple)':'var(--rg-sub)';const d=a.x===b.x?'M '+a.x+' '+a.y+' L '+b.x+' '+b.y:'M '+a.x+' '+a.y+' C '+a.x+' '+(a.y+(b.y-a.y)*.66)+', '+b.x+' '+(a.y+(b.y-a.y)*.34)+', '+b.x+' '+b.y;paths+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/>';});});
let circles='';commits.forEach(c=>{const p=position.get(c.id),color=c.lane?'var(--rg-purple)':'var(--rg-ink)';if(c.id===selected)circles+='<circle cx="'+p.x+'" cy="'+p.y+'" r="9" fill="var(--rg-paper)" stroke="'+color+'" stroke-width="1"/>';circles+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="'+color+'" stroke="var(--rg-paper)" stroke-width="1.5"/>';});
const rows=commits.map(c=>{let tags=Object.entries(branches).filter(([,head])=>head===c.id).map(([name])=>'<span class="rg-tag '+(name==='main'?'':'rg-experiment')+'">'+esc(name)+(name===branch?' · 当前':'')+'</span>').join('');if(remotes.main===c.id)tags+='<span class="rg-tag rg-remote">origin/main</span>';return '<button type="button" class="rg-commit cursor-interaction" data-commit="'+c.id+'" aria-pressed="'+(c.id===selected)+'" aria-label="查看版本：'+esc(c.title)+'"><span class="rg-commit-copy"><span class="rg-commit-title">'+esc(c.title)+'</span><span class="rg-commit-meta">'+tags+'<span class="rg-hash">'+c.id+'</span></span></span><span class="rg-commit-time">'+esc(c.time)+'</span></button>';}).join('');
$('#rg-list').innerHTML='<svg class="rg-graph" width="66" height="'+commits.length*rowHeight+'" viewBox="0 0 66 '+commits.length*rowHeight+'" role="img" aria-label="提交关系：主线与 ROI 实验分支，共用相机采集与标定版本">'+paths+circles+'</svg>'+rows;
const c=commits.find(x=>x.id===selected);$('#rg-details').hidden=!c;$('#rg-workspace').classList.toggle('rg-no-detail',!c);
if(c){fileIndex=Math.min(fileIndex,c.files.length-1);const f=c.files[fileIndex];$('#rg-details').innerHTML='<div class="rg-detail-heading">版本详情<button type="button" class="rg-icon-button cursor-interaction" data-action="close-detail" aria-label="关闭版本详情">'+icon('x')+'</button></div><h2 class="rg-version-title">'+esc(c.title)+'</h2><div class="rg-version-meta"><span class="rg-hash">'+c.id+'</span><span>刘亚宁 · '+esc(c.time)+'</span></div><div class="rg-files-label"><span>改动文件</span><span>'+c.files.length+' 个</span></div>'+c.files.map((x,i)=>'<button type="button" class="rg-file-button cursor-interaction" data-file="'+i+'" aria-pressed="'+(i===fileIndex)+'">'+icon('file-code-2')+'<span>'+esc(x.path)+'</span><b class="rg-added">+'+x.add+'</b><b class="rg-removed">−'+x.del+'</b></button>').join('')+'<pre class="rg-diff" aria-label="'+esc(f.path)+' 的差异"><code>'+f.lines.map(line=>'<span class="rg-code-line '+(line.startsWith('+')?'rg-code-add':line.startsWith('-')?'rg-code-del':'')+'">'+esc(line)+'</span>').join('')+'</code></pre><div class="rg-detail-actions"><button type="button" class="rg-button cursor-interaction" data-action="create">'+icon('git-branch-plus')+'从此创建分支</button><button type="button" class="rg-button rg-outline cursor-interaction" data-action="restore">'+icon('rotate-ccw')+'恢复到此版本</button></div>';}
icons();
}
function closeModal(){const overlay=$('#rg-overlay');overlay.hidden=true;overlay.innerHTML='';$('.rg-side').inert=false;$('.rg-main').inert=false;modalKind='';if(previousFocus?.isConnected)previousFocus.focus();}
function modal(title,body,actionText,action){
if($('#rg-overlay').hidden)previousFocus=document.activeElement;
$('.rg-side').inert=true;$('.rg-main').inert=true;
$('#rg-overlay').innerHTML='<section class="rg-dialog" role="dialog" aria-modal="true" aria-labelledby="rg-dialog-title"><div class="rg-dialog-head"><h2 id="rg-dialog-title">'+esc(title)+'</h2><button type="button" class="rg-icon-button cursor-interaction" data-action="cancel" aria-label="关闭">'+icon('x')+'</button></div>'+body+'<div id="rg-error" class="rg-error" role="alert"></div><div class="rg-dialog-actions"><button type="button" class="rg-button cursor-interaction" data-action="cancel">取消</button>'+(actionText?'<button type="button" class="rg-button rg-primary cursor-interaction" data-action="'+action+'">'+esc(actionText)+'</button>':'')+'</div></section>';
$('#rg-overlay').hidden=false;icons();const focus=$('#rg-overlay input:not([type="checkbox"]),#rg-overlay textarea,#rg-overlay select')||$('#rg-overlay button');focus?.focus();
}
function guardClean(action){if(!dirty.length)return true;modalKind='blocked';modal('先保存当前修改','<p>还有 '+dirty.length+' 个文件未保存。'+esc(action)+'前先保存，避免把未完成的修改带到其他版本。</p><div class="rg-summary"><div><span>当前分支</span><b>'+esc(branch)+'</b></div><div><span>你的修改</span><b>保留，不会自动丢弃</b></div></div>','查看并保存','save');return false;}
function openSave(){modalKind='save';modal('保存一个版本','<p>把这次修改留在本地。保存后可继续编辑，需要时再上传到 GitHub。</p>'+dirty.map((f,i)=>'<label class="rg-check-row"><input type="checkbox" value="'+i+'" checked data-save-file><span>'+esc(f.path)+'</span><b class="rg-added">+'+f.add+'</b><b class="rg-removed">−'+f.del+'</b></label>').join('')+'<label for="rg-commit-message">这次做了什么</label><textarea id="rg-commit-message" class="rg-input" rows="2" placeholder="例如：调整 ROI 跟踪参数并记录实验结果"></textarea>','保存到本地','confirm-save');}
function newCommit(title,files,parents){const id='d'+(0x650000+serial++).toString(16);const head=commits.find(c=>c.id===branches[branch]);const c={id,lane:head?.lane||0,title,parents:parents||[branches[branch]],time:'刚刚',files:files.length?files:[note]};commits.unshift(c);branches[branch]=id;selected=id;fileIndex=0;return c;}
function openRestore(){if(!guardClean('恢复代码'))return;const c=commits.find(x=>x.id===selected);if(!c)return;modalKind='restore';modal('恢复到这个版本','<p>让当前分支的代码恢复到所选版本，并生成一个新的恢复版本。原来的提交、分支和历史全部保留。</p><div class="rg-summary"><div><span>当前分支</span><b>'+esc(branch)+'</b></div><div><span>恢复目标</span><b>'+esc(c.title)+'</b></div><div><span>目标版本</span><b class="rg-hash">'+c.id+'</b></div><div><span>修改范围</span><b>当前分支的受跟踪文件</b></div><div><span>GitHub</span><b>不会自动上传</b></div></div>','生成恢复版本','confirm-restore');}
function openBranches(){modalKind='branches';modal('分支','<p>主线保留稳定结果，实验放在独立分支。</p>'+Object.keys(branches).map(name=>'<button type="button" class="rg-branch-option cursor-interaction" data-switch="'+esc(name)+'">'+icon('git-branch')+'<span>'+esc(name)+'</span>'+(name===branch?'<small>当前分支</small>':'')+'</button>').join('')+'<button type="button" class="rg-branch-option cursor-interaction" data-action="create-head">'+icon('plus')+'从当前版本新建分支</button>','','');}
function openCreate(){modalKind='create';const c=commits.find(x=>x.id===selected);modal('从此创建分支','<p>从「'+esc(c.title)+'」开始一条实验分支。创建后仍留在 '+esc(branch)+'，不会改动工作区。</p><label for="rg-branch-name">分支名称</label><input id="rg-branch-name" class="rg-input" placeholder="例如：lighting-experiment" autocomplete="off">','创建分支','confirm-create');}
function openMerge(){if(!guardClean('合并分支'))return;const names=Object.keys(branches).filter(n=>n!==branch);modalKind='merge';modal('合并到 '+branch,'<p>把实验分支的成果合入当前分支。原分支会保留，本示意演示无冲突的合并。</p><label for="rg-merge-source">选择要合入的分支</label><select id="rg-merge-source" class="rg-input">'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select><div class="rg-summary" style="margin-top:18px"><div><span>目标分支</span><b>'+esc(branch)+'</b></div><div><span>工作区</span><b>无未保存修改</b></div></div>','合并分支','confirm-merge');}
function openPush(){if(!ahead()){setStatus('演示：没有待上传版本');return;}modalKind='push';modal('上传到 GitHub','<p>把当前分支的 '+ahead()+' 个本地版本同步到远程仓库。</p><div class="rg-summary"><div><span>本地分支</span><b>'+esc(branch)+'</b></div><div><span>上传目标</span><b>origin / '+esc(branch)+'</b></div><div><span>未保存的文件</span><b>不会上传</b></div></div>','确认上传（演示）','confirm-push');}
root.addEventListener('click',e=>{
const commitButton=e.target.closest('[data-commit]');if(commitButton){selected=commitButton.dataset.commit;fileIndex=0;render();remember('查看版本详情');return;}
const fileButton=e.target.closest('[data-file]');if(fileButton){fileIndex=Number(fileButton.dataset.file);render();return;}
const switchButton=e.target.closest('[data-switch]');if(switchButton){const name=switchButton.dataset.switch;if(name===branch){closeModal();return;}if(!guardClean('切换分支'))return;branch=name;selected=branches[name];fileIndex=0;closeModal();statusMessage='演示：已切换到 '+branch;render();remember('切换分支');return;}
const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
if(action==='cancel'){closeModal();return;}
if(action==='close-detail'){selected=null;render();remember('收起版本详情');return;}
if(action==='save'){openSave();return;}
if(action==='restore'){openRestore();return;}
if(action==='branches'){openBranches();return;}
if(action==='create-head'){selected=branches[branch];fileIndex=0;render();openCreate();return;}
if(action==='create'){openCreate();return;}
if(action==='merge'){openMerge();return;}
if(action==='push'){openPush();return;}
if(action==='pull'){if(!guardClean('拉取更新'))return;setStatus('演示：已检查远程，没有新的版本需要拉取');remember('查看拉取反馈');return;}
if(action==='confirm-save'){
const title=$('#rg-commit-message').value.trim();const checks=[...root.querySelectorAll('[data-save-file]:checked')].map(x=>Number(x.value));
if(!checks.length){$('#rg-error').textContent='至少选择一个需要保存的文件。';return;}if(!title){$('#rg-error').textContent='写一句版本说明，之后更容易找回来。';$('#rg-commit-message').focus();return;}
const saved=dirty.filter((f,i)=>checks.includes(i));newCommit(title,saved);dirty=dirty.filter((f,i)=>!checks.includes(i));closeModal();statusMessage='演示：已保存到本地 · 尚未上传 GitHub';render();remember('保存本地版本');return;
}
if(action==='confirm-restore'){
const target=commits.find(c=>c.id===selected);newCommit('恢复到：'+target.title,target.files);closeModal();statusMessage='演示：已生成恢复版本，原有历史全部保留';render();remember('恢复旧代码，保留历史');return;
}
if(action==='confirm-create'){
const name=$('#rg-branch-name').value.trim();if(!/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$/.test(name)){$('#rg-error').textContent='示意中请使用 1–40 位字母、数字、短横线或下划线。';return;}if(branches[name]){$('#rg-error').textContent='分支名称已存在。';return;}
branches[name]=selected;closeModal();statusMessage='演示：已创建 '+name+'，仍在 '+branch;render();remember('创建实验分支');return;
}
if(action==='confirm-merge'){
const source=$('#rg-merge-source').value;if(!source)return;const sourceHead=branches[source];if(idsFrom(branches[branch]).has(sourceHead)){$('#rg-error').textContent='当前分支已包含这些版本，无需再次合并。';return;}
newCommit('合并 '+source+' 的实验结果',[roi,note],[branches[branch],sourceHead]);closeModal();statusMessage='演示：合并完成，实验分支与历史均保留';render();remember('合并实验分支');return;
}
if(action==='confirm-push'){remotes[branch]=branches[branch];closeModal();statusMessage='演示：上传完成 · 没有进行真实网络操作';render();remember('上传本地版本');}
});
$('#rg-overlay').addEventListener('click',e=>{if(e.target===$('#rg-overlay'))closeModal();});
root.addEventListener('keydown',e=>{if($('#rg-overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const focusable=[...$('#rg-overlay').querySelectorAll('button,input,textarea,select')].filter(el=>!el.disabled&&!el.hidden);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();

})();
</script>

<script>
(function(){
'use strict';
const root=document.getElementById('research-git-workbench-fpga');
const $=s=>root.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
const file=(path,add,del,lines)=>({path,add,del,lines});
const camera=file('configs/camera.yaml',2,2,['  camera:','-   exposure_ms: 6.0','+   exposure_ms: 8.0','-   auto_exposure: true','+   auto_exposure: false','    fps: 30']);
const capture=file('src/capture.py',8,3,['  def open_camera(config):','-   camera.set_auto(True)','+   camera.set_auto(False)','+   camera.set_exposure(','+       config.exposure_ms','+   )','    return camera']);
const roi=file('src/tracking/i2c_controller.v',18,6,['  def track(frame, roi):','-   points = detect(frame)','+   crop = frame[roi]','+   points = detect(crop)','+   points = stabilize(points)','    return points']);
const note=file('notes/experiment.md',12,0,['+ ## 低纹理区域跟踪','+ 调整 ROI 与曝光参数。','+ 记录弱纹理区域的跟踪结果。','+ 下一步：对比反光区域表现。']);
let commits=[
{id:'b73a19d',lane:0,title:'整理仿真结果与波形',parents:['92af684'],time:'18:20',files:[file('src/export.py',24,5,['  def export(results):','-   save(results)','+   save_csv(results)','+   save_preview(results)'])]},
{id:'c42e801',lane:1,title:'验证 I²C 寄存器读写',parents:['63cb1a2'],time:'17:35',files:[roi,note]},
{id:'92af684',lane:0,title:'修正复位时序约束',parents:['a8f21c9'],time:'16:42',files:[camera,capture]},
{id:'63cb1a2',lane:1,title:'加入接口时序仿真',parents:['a8f21c9'],time:'15:10',files:[roi]},
{id:'a8f21c9',lane:0,title:'完成时钟与接口梳理',parents:['f17c403'],time:'昨天',files:[camera,capture]},
{id:'f17c403',lane:0,title:'导入相机板工程',parents:[],time:'周四',files:[file('README.md',16,0,['+ # 相机板 FPGA 适配','+ 相机采集 → 标定 → 缺陷检测'])]}
];
const branches={main:'b73a19d','i2c-simulation':'c42e801'};
const remotes={main:'a8f21c9','i2c-simulation':'c42e801'};
let branch='main',selected='92af684',fileIndex=0,dirty=[roi,camera,note],serial=1,modalKind='',previousFocus=null,statusMessage='';
const design={detailPlacement:'side',density:'comfortable'};
const initial=null;
function acceptState(s){const p=s&&s.privateContent;if(!p)return;if(p.detailPlacement==='side'||p.detailPlacement==='bottom')design.detailPlacement=p.detailPlacement;if(p.density==='compact'||p.density==='comfortable')design.density=p.density;if(commits.some(c=>c.id===p.selected))selected=p.selected;}
acceptState(initial);
function remember(action){root.dispatchEvent(new CustomEvent('rw-git-action',{bubbles:true,detail:{action}}));}

function idsFrom(head){const seen=new Set();const visit=id=>{if(!id||seen.has(id))return;seen.add(id);const c=commits.find(x=>x.id===id);if(c)c.parents.forEach(visit);};visit(head);return seen;}
function ahead(){const local=idsFrom(branches[branch]),remote=idsFrom(remotes[branch]);return [...local].filter(id=>!remote.has(id)).length;}
function defaultStatus(){const n=ahead();return branch+' · '+(n?n+' 个本地版本待上传':'已与远程同步');}
function setStatus(message){statusMessage=message;$('#rf-status').textContent=message;}
function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
function render(){
root.dataset.detail=design.detailPlacement;root.dataset.density=design.density;
$('#rf-branch-label').textContent=branch;$('#rf-push-count').textContent=ahead();$('#rf-push-count').hidden=!ahead();
$('#rf-change-text').innerHTML=dirty.length?dirty.length+' 个文件有改动<small>尚未保存为版本</small>':'所有修改已保存<small>工作区干净，可以切换分支或合并</small>';
$('#rf-save-button').hidden=!dirty.length;
$('#rf-status').textContent=statusMessage||defaultStatus();
const rowHeight=design.density==='compact'?58:68;
const position=new Map(commits.map((c,i)=>[c.id,{x:c.lane?49:20,y:i*rowHeight+rowHeight/2}]));
let paths='';
commits.forEach(c=>{const a=position.get(c.id);c.parents.forEach(pid=>{const b=position.get(pid);if(!b)return;const color=c.lane?'var(--rf-purple)':'var(--rf-sub)';const d=a.x===b.x?'M '+a.x+' '+a.y+' L '+b.x+' '+b.y:'M '+a.x+' '+a.y+' C '+a.x+' '+(a.y+(b.y-a.y)*.66)+', '+b.x+' '+(a.y+(b.y-a.y)*.34)+', '+b.x+' '+b.y;paths+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2"/>';});});
let circles='';commits.forEach(c=>{const p=position.get(c.id),color=c.lane?'var(--rf-purple)':'var(--rf-ink)';if(c.id===selected)circles+='<circle cx="'+p.x+'" cy="'+p.y+'" r="9" fill="var(--rf-paper)" stroke="'+color+'" stroke-width="1"/>';circles+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4.5" fill="'+color+'" stroke="var(--rf-paper)" stroke-width="1.5"/>';});
const rows=commits.map(c=>{let tags=Object.entries(branches).filter(([,head])=>head===c.id).map(([name])=>'<span class="rf-tag '+(name==='main'?'':'rf-experiment')+'">'+esc(name)+(name===branch?' · 当前':'')+'</span>').join('');if(remotes.main===c.id)tags+='<span class="rf-tag rf-remote">origin/main</span>';return '<button type="button" class="rf-commit cursor-interaction" data-commit="'+c.id+'" aria-pressed="'+(c.id===selected)+'" aria-label="查看版本：'+esc(c.title)+'"><span class="rf-commit-copy"><span class="rf-commit-title">'+esc(c.title)+'</span><span class="rf-commit-meta">'+tags+'<span class="rf-hash">'+c.id+'</span></span></span><span class="rf-commit-time">'+esc(c.time)+'</span></button>';}).join('');
$('#rf-list').innerHTML='<svg class="rf-graph" width="66" height="'+commits.length*rowHeight+'" viewBox="0 0 66 '+commits.length*rowHeight+'" role="img" aria-label="提交关系：主线与 ROI 实验分支，共用相机采集与标定版本">'+paths+circles+'</svg>'+rows;
const c=commits.find(x=>x.id===selected);$('#rf-details').hidden=!c;$('#rf-workspace').classList.toggle('rf-no-detail',!c);
if(c){fileIndex=Math.min(fileIndex,c.files.length-1);const f=c.files[fileIndex];$('#rf-details').innerHTML='<div class="rf-detail-heading">版本详情<button type="button" class="rf-icon-button cursor-interaction" data-action="close-detail" aria-label="关闭版本详情">'+icon('x')+'</button></div><h2 class="rf-version-title">'+esc(c.title)+'</h2><div class="rf-version-meta"><span class="rf-hash">'+c.id+'</span><span>刘亚宁 · '+esc(c.time)+'</span></div><div class="rf-files-label"><span>改动文件</span><span>'+c.files.length+' 个</span></div>'+c.files.map((x,i)=>'<button type="button" class="rf-file-button cursor-interaction" data-file="'+i+'" aria-pressed="'+(i===fileIndex)+'">'+icon('file-code-2')+'<span>'+esc(x.path)+'</span><b class="rf-added">+'+x.add+'</b><b class="rf-removed">−'+x.del+'</b></button>').join('')+'<pre class="rf-diff" aria-label="'+esc(f.path)+' 的差异"><code>'+f.lines.map(line=>'<span class="rf-code-line '+(line.startsWith('+')?'rf-code-add':line.startsWith('-')?'rf-code-del':'')+'">'+esc(line)+'</span>').join('')+'</code></pre><div class="rf-detail-actions"><button type="button" class="rf-button cursor-interaction" data-action="create">'+icon('git-branch-plus')+'从此创建分支</button><button type="button" class="rf-button rf-outline cursor-interaction" data-action="restore">'+icon('rotate-ccw')+'恢复到此版本</button></div>';}
icons();
}
function closeModal(){const overlay=$('#rf-overlay');overlay.hidden=true;overlay.innerHTML='';$('.rf-side').inert=false;$('.rf-main').inert=false;modalKind='';if(previousFocus?.isConnected)previousFocus.focus();}
function modal(title,body,actionText,action){
if($('#rf-overlay').hidden)previousFocus=document.activeElement;
$('.rf-side').inert=true;$('.rf-main').inert=true;
$('#rf-overlay').innerHTML='<section class="rf-dialog" role="dialog" aria-modal="true" aria-labelledby="rf-dialog-title"><div class="rf-dialog-head"><h2 id="rf-dialog-title">'+esc(title)+'</h2><button type="button" class="rf-icon-button cursor-interaction" data-action="cancel" aria-label="关闭">'+icon('x')+'</button></div>'+body+'<div id="rf-error" class="rf-error" role="alert"></div><div class="rf-dialog-actions"><button type="button" class="rf-button cursor-interaction" data-action="cancel">取消</button>'+(actionText?'<button type="button" class="rf-button rf-primary cursor-interaction" data-action="'+action+'">'+esc(actionText)+'</button>':'')+'</div></section>';
$('#rf-overlay').hidden=false;icons();const focus=$('#rf-overlay input:not([type="checkbox"]),#rf-overlay textarea,#rf-overlay select')||$('#rf-overlay button');focus?.focus();
}
function guardClean(action){if(!dirty.length)return true;modalKind='blocked';modal('先保存当前修改','<p>还有 '+dirty.length+' 个文件未保存。'+esc(action)+'前先保存，避免把未完成的修改带到其他版本。</p><div class="rf-summary"><div><span>当前分支</span><b>'+esc(branch)+'</b></div><div><span>你的修改</span><b>保留，不会自动丢弃</b></div></div>','查看并保存','save');return false;}
function openSave(){modalKind='save';modal('保存一个版本','<p>把这次修改留在本地。保存后可继续编辑，需要时再上传到 GitHub。</p>'+dirty.map((f,i)=>'<label class="rf-check-row"><input type="checkbox" value="'+i+'" checked data-save-file><span>'+esc(f.path)+'</span><b class="rf-added">+'+f.add+'</b><b class="rf-removed">−'+f.del+'</b></label>').join('')+'<label for="rf-commit-message">这次做了什么</label><textarea id="rf-commit-message" class="rf-input" rows="2" placeholder="例如：调整 ROI 跟踪参数并记录实验结果"></textarea>','保存到本地','confirm-save');}
function newCommit(title,files,parents){const id='d'+(0x650000+serial++).toString(16);const head=commits.find(c=>c.id===branches[branch]);const c={id,lane:head?.lane||0,title,parents:parents||[branches[branch]],time:'刚刚',files:files.length?files:[note]};commits.unshift(c);branches[branch]=id;selected=id;fileIndex=0;return c;}
function openRestore(){if(!guardClean('恢复代码'))return;const c=commits.find(x=>x.id===selected);if(!c)return;modalKind='restore';modal('恢复到这个版本','<p>让当前分支的代码恢复到所选版本，并生成一个新的恢复版本。原来的提交、分支和历史全部保留。</p><div class="rf-summary"><div><span>当前分支</span><b>'+esc(branch)+'</b></div><div><span>恢复目标</span><b>'+esc(c.title)+'</b></div><div><span>目标版本</span><b class="rf-hash">'+c.id+'</b></div><div><span>修改范围</span><b>当前分支的受跟踪文件</b></div><div><span>GitHub</span><b>不会自动上传</b></div></div>','生成恢复版本','confirm-restore');}
function openBranches(){modalKind='branches';modal('分支','<p>主线保留稳定结果，实验放在独立分支。</p>'+Object.keys(branches).map(name=>'<button type="button" class="rf-branch-option cursor-interaction" data-switch="'+esc(name)+'">'+icon('git-branch')+'<span>'+esc(name)+'</span>'+(name===branch?'<small>当前分支</small>':'')+'</button>').join('')+'<button type="button" class="rf-branch-option cursor-interaction" data-action="create-head">'+icon('plus')+'从当前版本新建分支</button>','','');}
function openCreate(){modalKind='create';const c=commits.find(x=>x.id===selected);modal('从此创建分支','<p>从「'+esc(c.title)+'」开始一条实验分支。创建后仍留在 '+esc(branch)+'，不会改动工作区。</p><label for="rf-branch-name">分支名称</label><input id="rf-branch-name" class="rf-input" placeholder="例如：lighting-experiment" autocomplete="off">','创建分支','confirm-create');}
function openMerge(){if(!guardClean('合并分支'))return;const names=Object.keys(branches).filter(n=>n!==branch);modalKind='merge';modal('合并到 '+branch,'<p>把实验分支的成果合入当前分支。原分支会保留，本示意演示无冲突的合并。</p><label for="rf-merge-source">选择要合入的分支</label><select id="rf-merge-source" class="rf-input">'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')+'</select><div class="rf-summary" style="margin-top:18px"><div><span>目标分支</span><b>'+esc(branch)+'</b></div><div><span>工作区</span><b>无未保存修改</b></div></div>','合并分支','confirm-merge');}
function openPush(){if(!ahead()){setStatus('演示：没有待上传版本');return;}modalKind='push';modal('上传到 GitHub','<p>把当前分支的 '+ahead()+' 个本地版本同步到远程仓库。</p><div class="rf-summary"><div><span>本地分支</span><b>'+esc(branch)+'</b></div><div><span>上传目标</span><b>origin / '+esc(branch)+'</b></div><div><span>未保存的文件</span><b>不会上传</b></div></div>','确认上传（演示）','confirm-push');}
root.addEventListener('click',e=>{
const commitButton=e.target.closest('[data-commit]');if(commitButton){selected=commitButton.dataset.commit;fileIndex=0;render();remember('查看版本详情');return;}
const fileButton=e.target.closest('[data-file]');if(fileButton){fileIndex=Number(fileButton.dataset.file);render();return;}
const switchButton=e.target.closest('[data-switch]');if(switchButton){const name=switchButton.dataset.switch;if(name===branch){closeModal();return;}if(!guardClean('切换分支'))return;branch=name;selected=branches[name];fileIndex=0;closeModal();statusMessage='演示：已切换到 '+branch;render();remember('切换分支');return;}
const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;
if(action==='cancel'){closeModal();return;}
if(action==='close-detail'){selected=null;render();remember('收起版本详情');return;}
if(action==='save'){openSave();return;}
if(action==='restore'){openRestore();return;}
if(action==='branches'){openBranches();return;}
if(action==='create-head'){selected=branches[branch];fileIndex=0;render();openCreate();return;}
if(action==='create'){openCreate();return;}
if(action==='merge'){openMerge();return;}
if(action==='push'){openPush();return;}
if(action==='pull'){if(!guardClean('拉取更新'))return;setStatus('演示：已检查远程，没有新的版本需要拉取');remember('查看拉取反馈');return;}
if(action==='confirm-save'){
const title=$('#rf-commit-message').value.trim();const checks=[...root.querySelectorAll('[data-save-file]:checked')].map(x=>Number(x.value));
if(!checks.length){$('#rf-error').textContent='至少选择一个需要保存的文件。';return;}if(!title){$('#rf-error').textContent='写一句版本说明，之后更容易找回来。';$('#rf-commit-message').focus();return;}
const saved=dirty.filter((f,i)=>checks.includes(i));newCommit(title,saved);dirty=dirty.filter((f,i)=>!checks.includes(i));closeModal();statusMessage='演示：已保存到本地 · 尚未上传 GitHub';render();remember('保存本地版本');return;
}
if(action==='confirm-restore'){
const target=commits.find(c=>c.id===selected);newCommit('恢复到：'+target.title,target.files);closeModal();statusMessage='演示：已生成恢复版本，原有历史全部保留';render();remember('恢复旧代码，保留历史');return;
}
if(action==='confirm-create'){
const name=$('#rf-branch-name').value.trim();if(!/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,39}$/.test(name)){$('#rf-error').textContent='示意中请使用 1–40 位字母、数字、短横线或下划线。';return;}if(branches[name]){$('#rf-error').textContent='分支名称已存在。';return;}
branches[name]=selected;closeModal();statusMessage='演示：已创建 '+name+'，仍在 '+branch;render();remember('创建实验分支');return;
}
if(action==='confirm-merge'){
const source=$('#rf-merge-source').value;if(!source)return;const sourceHead=branches[source];if(idsFrom(branches[branch]).has(sourceHead)){$('#rf-error').textContent='当前分支已包含这些版本，无需再次合并。';return;}
newCommit('合并 '+source+' 的实验结果',[roi,note],[branches[branch],sourceHead]);closeModal();statusMessage='演示：合并完成，实验分支与历史均保留';render();remember('合并实验分支');return;
}
if(action==='confirm-push'){remotes[branch]=branches[branch];closeModal();statusMessage='演示：上传完成 · 没有进行真实网络操作';render();remember('上传本地版本');}
});
$('#rf-overlay').addEventListener('click',e=>{if(e.target===$('#rf-overlay'))closeModal();});
root.addEventListener('keydown',e=>{if($('#rf-overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal();return;}if(e.key==='Tab'){const focusable=[...$('#rf-overlay').querySelectorAll('button,input,textarea,select')].filter(el=>!el.disabled&&!el.hidden);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();

})();

cable:{name:'电缆表面检测',full:'电缆表面低纹理跟踪与缺陷检测',path:'E:/Research/cable-inspection',last:'9月18日 22:46',tasks:[{id:'ct1',name:'低纹理区域跟踪对比',start:'2026-09-16',end:'2026-09-20',done:false,last:'完成 ROI 裁剪与固定曝光，弱纹理样本能连续跟踪；反光段仍有漂移。',next:'补测反光段，比较不同 ROI 尺寸的稳定性。',manual:'',note:'cn1'},{id:'ct2',name:'相机曝光与标定检查',start:'2026-09-14',end:'2026-09-16',done:true,last:'修正参数读取，保存标定基线。',next:'',manual:'',note:'cn2'},{id:'ct3',name:'整理实验与缺陷结果',start:'2026-09-18',end:'2026-09-20',done:false,last:'完成结果导出，待补充样本对比。',next:'汇总低纹理与反光样本。',manual:'',note:'cn1'},{id:'ct4',name:'补充低纹理跟踪文献',start:'',end:'',done:false,last:'',next:'',manual:'',note:'cn1'}],notes:[{id:'cn1',title:'低纹理区域跟踪 · 第一次对比',date:'2026-09-18',created:'2026-09-18 21:12',updated:'2026-09-18 22:46',source:'手动记录',body:'## 今天观察到的现象\n\n固定曝光后，**弱纹理段的 ROI 跟踪更稳定**，但反光较强时仍有短暂漂移。\n\n### 实验设置\n\n- 固定曝光，关闭自动曝光。\n- ROI 尺寸先保持一致。\n- 对比正常表面、弱纹理和反光三个片段。\n\n```python\ncamera.set_auto(False)\ncamera.set_exposure(8.0)\nresult = tracker.track(frame, roi)\n```\n\n> 当前只是样本观察，尚不能说明整个检测系统已经验证通过。\n\n### 接下来\n\n补测反光片段，记录漂移发生的位置，再比较不同 ROI 尺寸。',comments:[{quote:'反光较强时仍有短暂漂移',text:'下一次先固定其他变量，只比较 ROI 尺寸。',time:'9月18日 22:46'}]},{id:'cn2',title:'相机采集与标定检查',date:'2026-09-17',created:'2026-09-17 17:30',updated:'2026-09-17 19:05',source:'助手记录',body:'## 参数检查\n\n完成配置读取路径核对，确认曝光与标定参数可以正确加载。\n\n- 已检查：配置读取与采集接口。\n- 已保存：本地代码版本。\n- 待验证：不同光照下的持续采集。\n\n**代码修复完成，不等于完整系统验证完成。**',comments:[]}],knowledge:[{id:'ck1',title:'项目架构',body:'## 从采集到缺陷结果\n\n项目按三个阶段组织：**相机采集 → ROI 跟踪 → 缺陷分析与导出**。\n\n### 1. 相机采集\n\n负责曝光配置、图像采集与标定参数读取。固定采集条件，才能比较后续算法。\n\n### 2. ROI 跟踪\n\n在连续帧中保持目标区域对应关系，为多帧缺陷定位提供基础。\n\n### 3. 缺陷分析\n\n对跟踪区域开展分析，输出可复核的结果和原始片段。\n\n> 当前反光区域跟踪仍待验证，不把模块存在当作实验结论。',updated:'9月18日 23:00',manual:false},{id:'ck2',title:'关键概念 · ROI 与弱纹理',body:'## ROI\n\n**Region of Interest，感兴趣区域。** 限定需要处理的图像范围，减少背景干扰。\n\n## 弱纹理\n\n局部缺少稳定、易区分的视觉结构；并不是图像分辨率低。\n\n## 与本项目的关系\n\n电缆表面纹理弱且可能反光，需要观察 ROI 在连续帧中的漂移，而不只看单帧检测结果。',updated:'9月18日 23:00',manual:false},{id:'ck3',title:'阶段认识与待验证问题',body:'## 已有认识\n\n固定曝光有助于减少图像变化，但当前观察只覆盖少量样本。\n\n## 待验证\n\n- ROI 尺寸是否影响反光片段的跟踪稳定性。\n- 漂移会不会进一步影响缺陷定位。\n- 是否需要更多角度与光照条件的样本。',updated:'9月18日 23:00',manual:false}],papers:[{id:'cp1',title:'低纹理区域跟踪方法调研',author:'示例文献 · 待补全作者与年份',url:'',note:'## 阅读目的\n\n围绕电缆表面检测，关注弱纹理区域的多帧对应关系。\n\n## 需要回答的问题\n\n1. 方法依赖哪些视觉信息？\n2. 遇到反光或遮挡时如何处理？\n3. 是否适合目前的采集条件？',source:'对话中提及',date:'9月18日',read:true},{id:'cp2',title:'电缆表面缺陷检测相关研究',author:'示例文献 · 等待补充原文',url:'',note:'',source:'手动添加',date:'9月17日',read:false}]},

function renderKnowledge(){const k=p().knowledge.find(k=>k.id===state.knowledge)||p().knowledge[0];state.knowledge=k.id;toolbar('知识库',button('维护设置','knowledge-settings','settings-2')+button('查看更新','knowledge-updates','git-pull-request','rw-outline'));$('#rw-content').innerHTML='<div class="rw-split"><div class="rw-page-list"><small>项目理解</small>'+p().knowledge.map(x=>'<button type="button" class="cursor-interaction" data-knowledge="'+x.id+'" aria-pressed="'+(x.id===k.id)+'">'+icon('file-text')+esc(x.title)+'</button>').join('')+'</div><div><div class="rw-row"><span class="rw-sub">'+(k.manual?'包含人工修改 · 不自动覆盖':'依据项目记录整理')+'</span>'+button('编辑','edit-knowledge','pencil','','data-id="'+k.id+'"')+button('来源','knowledge-sources','link')+'</div><article class="rw-markdown">'+markdown(k.body)+'</article><details class="rw-meta"><summary>页面信息</summary><p>最近整理：'+k.updated+'<br>知识讲解不是日报，不按日期重复堆积。</p></details></div></div>'}
function renderLiterature(){if(state.detail){const paper=p().papers.find(x=>x.id===state.detail);if(paper){renderPaper(paper);return}state.detail=null}toolbar('文献',button('添加文献','new-paper','plus','rw-primary'));const papers=p().papers.filter(x=>x.title.toLowerCase().includes(state.query.toLowerCase()));$('#rw-content').innerHTML='<div class="rw-row" style="margin-bottom:18px"><span class="rw-sub">'+esc(p().name)+' · '+p().papers.length+' 篇文献</span><input id="rw-paper-search" class="rw-input rw-search rw-spacer" aria-label="搜索当前项目文献" placeholder="搜索当前项目" value="'+esc(state.query)+'"></div><div class="rw-list" id="rw-paper-list">'+paperRows(papers)+'</div><div class="rw-tiny-note">只收录文献。可以先保存地址，再补充原文或阅读笔记。</div>'}

function renderPaper(paper){toolbar('',button('返回文献','back','arrow-left')+'<span class="rw-spacer"></span>'+button('编辑信息','edit-paper','pencil')+button(paper.read?'标记未读':'标记已读','paper-read',paper.read?'circle':'check','rw-outline'));$('#rw-content').innerHTML='<div class="rw-editor-body"><h1 class="rw-reading-title">'+esc(paper.title)+'</h1><div class="rw-paper-info"><span>'+esc(paper.author)+'</span><span>'+esc(p().name)+'</span><span>'+paper.source+'</span></div><div class="rw-row">'+(safeUrl(paper.url)?'<a class="rw-button rw-outline cursor-interaction" href="'+esc(safeUrl(paper.url))+'" target="_blank" rel="noopener noreferrer">'+icon('external-link')+'打开原文地址</a>':button('补充原文地址','edit-paper','link','rw-outline'))+button('编辑阅读笔记','paper-note','notebook-pen')+button('移出本项目','remove-paper','trash-2')+'</div><hr class="rw-rule"><span class="rw-sub">阅读笔记</span><article class="rw-markdown">'+(paper.note?markdown(paper.note):'<p class="rw-sub">还没有阅读笔记。文献可以先收藏，不必先下载。</p>')+'</article></div>'}
let dialogData=null;
function taskDialog(id){const t=p().tasks.find(x=>x.id===id)||{name:'',start:'',end:'',done:false,last:'还没有可整理的工作记录。',next:'',manual:''};dialogData={id:id||null};modal(id?'任务详情':'新建任务',field('任务名称','rw-task-name',t.name)+ '<div class="rw-form-row">'+field('计划开始','rw-task-start',t.start,'date')+field('计划结束','rw-task-end',t.end,'date')+'</div><label class="rw-check"><input id="rw-task-done" type="checkbox" '+(t.done?'checked':'')+'> 已完成</label><hr class="rw-rule"><span class="rw-sub">助手整理 · 与手写内容分开</span><p>'+esc(t.last)+'</p><p><span class="rw-sub">下一步：</span>'+esc(t.next||'等待后续项目记录')+'</p><label class="rw-field"><span>我的补充</span><textarea class="rw-input" id="rw-task-manual" rows="3" placeholder="可选，不会被自动整理覆盖">'+esc(t.manual||'')+'</textarea></label>','save-task')}

function scheduleDialog(section='all'){dialogData={section};modal(section==='all'?'日报与周报 · 生成设置':'知识与文献 · 维护设置','<label class="rw-check"><input id="rw-auto-daily" type="checkbox" '+(prefs.daily?'checked':'')+'> 每天生成日报草稿</label>'+field('每日时间','rw-daily-time',prefs.time,'time')+'<label class="rw-check"><input id="rw-auto-weekly" type="checkbox" '+(prefs.weekly?'checked':'')+'> 每周从日报提炼周报草稿</label><div class="rw-form-row"><label class="rw-field"><span>每周</span><select class="rw-input" id="rw-weekly-day">'+['一','二','三','四','五','六','日'].map((d,i)=>'<option value="'+(i+1)+'" '+(String(i+1)===prefs.day?'selected':'')+'>星期'+d+'</option>').join('')+'</select></label>'+field('时间','rw-weekly-time',prefs.weeklyTime,'time')+'</div><hr class="rw-rule"><label class="rw-check"><input id="rw-auto-knowledge" type="checkbox" '+(prefs.knowledge?'checked':'')+'> 同时整理知识库，有冲突时再确认</label><label class="rw-check"><input id="rw-auto-literature" type="checkbox" '+(prefs.literature?'checked':'')+'> 同时收录项目对话中提到的文献</label><p class="rw-sub">体验设置，不会创建真实定时任务。自动整理不覆盖正式报告和人工修改，也不阻塞当前工作。</p>','save-schedule')}
function generateDialog(){modal('生成报告草稿','<label class="rw-field"><span>报告类型</span><select id="rw-generate-type" class="rw-input"><option value="daily" '+(state.reportType==='daily'?'selected':'')+'>日报 · 详细工作留痕</option><option value="weekly" '+(state.reportType==='weekly'?'selected':'')+'>周报 · 按刘亚宁模板提炼</option></select></label>'+field('工作日期 / 周报结束日期','rw-generate-date','2026-09-19','date')+'<span class="rw-sub">纳入的项目</span><div style="margin:8px 0">'+Object.entries(projects).map(([id,x])=>'<label class="rw-check"><input type="checkbox" name="rw-generate-project" value="'+id+'" '+(state.reportScope==='all'||state.reportScope===id?'checked':'')+'> '+esc(x.name)+'</label>').join('')+'</div><p class="rw-sub">这里用示例记录演示生成结果，不读取真实聊天或文件，不调用 AI。不覆盖已有草稿或正式版。</p>','generate-report','生成草稿')}
function reportBody(type,date,ids){const end=new Date(date+'T00:00:00Z'),start=new Date(end);start.setUTCDate(start.getUTCDate()-(start.getUTCDay()+6)%7);const label=d=>d.getUTCFullYear()+'年'+String(d.getUTCMonth()+1).padStart(2,'0')+'月'+String(d.getUTCDate()).padStart(2,'0')+'日';const heading='# 刘亚宁周报（'+label(start)+'—'+label(end)+'）';if(type==='weekly'&&ids.includes('cable')&&ids.includes('fpga'))return weekly.replace(/^# [^\n]*/,heading);if(type==='weekly'){return heading+'\n\n## 本周工作\n\n'+ids.map((id,i)=>'### '+['一','二','三','四'][i%4]+'、'+projects[id].full+'\n\n'+projects[id].tasks.slice(0,3).map((t,j)=>(j+1)+'. '+(t.done?'完成':'开展')+t.name+'。'+(t.done?'':t.last||'尚待补充工作记录。')).join('\n')).join('\n\n')+'\n\n## 下周计划\n\n'+ids.map((id,i)=>'### '+['一','二','三','四'][i%4]+'、'+projects[id].name+'\n\n'+projects[id].tasks.filter(t=>!t.done).slice(0,2).map((t,j)=>(j+1)+'. '+(t.next||t.name)+'。').join('\n')).join('\n\n')+'\n\n## 需要协调与帮助\n\n暂无。'}return '# '+date+' 科研日报\n\n'+ids.map(id=>{const x=projects[id];return '## '+x.name+'\n\n### 今日工作与观察\n\n'+(x.notes[0]?.body||'暂无可用科研记录，需要补充实际工作。')+'\n\n### 当前停在哪里\n\n'+x.tasks.filter(t=>!t.done).map(t=>'- **'+t.name+'**：'+(t.last||'尚无上下文')).join('\n')+'\n\n### 下一步\n\n'+x.tasks.filter(t=>!t.done).map(t=>'- '+(t.next||t.name)).join('\n')+'\n\n### 来源与证据边界\n\n来自本原型内的科研记录和任务上下文；不代表真实的当日活动，也没有自动把任务标为完成。'}).join('\n\n---\n\n')}
function sourcesDialog(kind){let body='';if(kind==='report'&&editor?.type==='weekly'){body='<p class="rw-sub">周报从日报提炼，不把代码修改直接等同于科研成果。</p>'+reports.filter(r=>r.type==='daily').map(r=>'<div class="rw-source-row">'+button(esc(r.title),'source-report','file-text','','data-id="'+r.id+'"')+'<span class="rw-tag">'+(r.state==='final'?'正式版':'草稿')+'</span></div>').join('')}else{const ids=kind==='report'&&editor?.scope==='all'?Object.keys(projects):[kind==='report'?editor.scope:state.project];body=ids.map(id=>'<div class="rw-section-title">'+esc(projects[id].name)+'</div>'+projects[id].notes.map(n=>'<div class="rw-source-row">'+button(esc(n.title),'source-note','notebook-pen','','data-id="'+n.id+'" data-project-id="'+id+'"')+'</div>').join('')).join('')+'<p class="rw-sub">此处展示来源跳转；真实聊天与文件采集尚未接入本预览。</p>'}modal('查看来源',body)}
function documentChanged(){if(editor){editor.updated=stamp();tell('已暂存在本次预览中。')}}
function insertText(text,preview=false){if(!editor||editor.state==='final')return;const t=$('#rw-edit-text');if(t){const a=t.selectionStart,b=t.selectionEnd;t.setRangeText(text,a,b,'end');editor.body=t.value}else editor.body+=(editor.body?'\n\n':'')+text;documentChanged();if(preview){state.mode='preview';render();$('[data-rw=mode-preview]')?.focus()}else if(t)t.focus();else render();remember('编辑文档')}
function importImages(files){if(!editor||editor.state==='final')return;flush();const target=editor;const selected=Array.from(files).filter(f=>/^image\/(png|jpeg|webp)$/.test(f.type));if(!selected.length){tell('请选择 PNG、JPG 或 WebP 图片。');return}for(const f of selected){if(f.size>8*1024*1024){tell('单张图片请小于 8 MB。');continue}const reader=new FileReader();reader.onload=()=>{const id=uid();assets[id]=reader.result;const mark='\n\n![截图](attachment:'+id+')\n';if(editor===target)insertText(mark,true);else{target.body+=mark;target.updated=stamp()}tell('截图已插入正文 · 仅保存在本次预览，不上传。')};reader.onerror=()=>tell('图片读取失败，请重新粘贴。');reader.readAsDataURL(f)}}
function submitModal(){
if(modalAction==='save-task'){const name=$('#rw-task-name').value.trim(),start=$('#rw-task-start').value,end=$('#rw-task-end').value;if(!name)return error('请填写任务名称。');if((start&&!end)||(!start&&end)||end&&end<start)return error('请同时填写开始与结束日期，结束不得早于开始。');let t=p().tasks.find(x=>x.id===dialogData.id);if(!t){t={id:uid(),last:'还没有可整理的工作记录。',next:'',note:p().notes[0]?.id||'',manual:''};p().tasks.push(t)}Object.assign(t,{name,start,end,done:$('#rw-task-done').checked,manual:$('#rw-task-manual').value});closeModal();render();tell('任务安排已保存，助手不会擅自修改日期和完成状态。')}
else if(modalAction==='save-project'){const name=$('#rw-new-project-name').value.trim(),path=$('#rw-new-project-path').value.trim();if(!name)return error('请填写项目名称。');const id=uid();projects[id]={name,full:name,path:path||'尚未绑定',last:'暂无工作记录',tasks:[],notes:[],knowledge:[{id:id+'k',title:'项目概览',body:'# '+name+'\n\n从一条科研记录开始，逐步积累项目理解。',updated:stamp(),manual:false}],papers:[]};closeModal();state.project=id;state.view='progress';state.detail=null;state.knowledge=id+'k';render();tell('已添加示例项目，没有注册真实目录。')}
else if(modalAction==='save-paper'){const title=$('#rw-paper-title').value.trim(),url=$('#rw-paper-url').value.trim(),author=$('#rw-paper-author').value.trim();if(!title)return error('请填写文献标题。');if(url&&!safeUrl(url))return error('请输入完整的 http:// 或 https:// 地址。');let paper=p().papers.find(x=>x.id===dialogData.id);if(!paper){paper={id:uid(),source:'手动收藏',read:false,note:'',date:'2026-09-19'};p().papers.unshift(paper)}Object.assign(paper,{title,url,author:author||'作者待补充'});closeModal();state.detail=paper.id;render();tell('已保存文献信息，不下载原文。')}
else if(modalAction==='save-paper-note'){p().papers.find(x=>x.id===state.detail).note=$('#rw-paper-note').value;closeModal();render();tell('阅读笔记已保存到本次预览。')}
else if(modalAction==='remove-paper'){p().papers=p().papers.filter(x=>x.id!==state.detail);closeModal();state.detail=null;render();tell('已从当前项目移出，不删除任何本地文件。')}
else if(modalAction==='save-schedule'){Object.assign(prefs,{daily:$('#rw-auto-daily').checked,weekly:$('#rw-auto-weekly').checked,time:$('#rw-daily-time').value,day:$('#rw-weekly-day').value,weeklyTime:$('#rw-weekly-time').value,knowledge:$('#rw-auto-knowledge').checked,literature:$('#rw-auto-literature').checked});closeModal();tell('设置已在本次预览保留；没有创建后台任务。')}
else if(modalAction==='generate-report'){const type=$('#rw-generate-type').value,date=$('#rw-generate-date').value,ids=$$('input[name="rw-generate-project"]:checked').map(x=>x.value);if(!date)return error('请选择日期。');if(!ids.length)return error('至少选择一个项目。');const r={id:uid(),type,title:date+' '+(type==='daily'?'科研日报':'科研周报'),date,scope:ids.length===1?ids[0]:'all',state:'draft',created:stamp(),updated:stamp(),comments:[],body:reportBody(type,date,ids)};reports.unshift(r);closeModal();state.reportType=type;go('reports',r.id);tell('新的示例草稿已生成，可直接编辑后确认。')}
else if(modalAction==='confirm-report'){editor.state='final';editor.updated=stamp();closeModal();state.mode='preview';render();tell('已确认为正式版。自动生成不会覆盖这份报告。')}
else if(modalAction==='reopen-report'){editor.state='draft';closeModal();state.mode='edit';render();tell('已转回草稿，请修改后重新确认。')}
else if(modalAction==='save-comment'){const text=$('#rw-comment').value.trim();if(!text)return error('请填写批注。');editor.comments.push({quote:selectionQuote,text,time:stamp()});editor.updated=stamp();closeModal();render();tell('批注已添加。')}
else if(modalAction==='save-knowledge'){const k=p().knowledge.find(x=>x.id===state.knowledge);k.body=$('#rw-knowledge-text').value;k.manual=true;k.updated=stamp();closeModal();render();tell('人工修改已保存，后续自动整理不会直接覆盖。')}
else if(modalAction==='accept-knowledge'){const k=p().knowledge.find(x=>x.id===state.knowledge);k.body+='\n\n## 补充：下一轮验证\n\n- 固定输入条件后再比较结果，区分代码已完成与实测已验证。\n- 保留失败样例及实验条件，便于复现。';k.updated=stamp();closeModal();render();tell('已接受这次补充，原有人工内容保留。')}
remember('确认操作')}
root.addEventListener('click',e=>{
if(e.target.closest('#rw-git-host'))return;
const navButton=e.target.closest('[data-view]');if(navButton){go(navButton.dataset.view);return}
const projectButton=e.target.closest('[data-project]');if(projectButton){closeModal();switchProject(projectButton.dataset.project);return}
const typeButton=e.target.closest('[data-report-type]');if(typeButton){state.reportType=typeButton.dataset.reportType;render();remember('切换报告类型');return}
const knowledgeButton=e.target.closest('[data-knowledge]');if(knowledgeButton){state.knowledge=knowledgeButton.dataset.knowledge;render();remember('阅读知识');return}
const b=e.target.closest('[data-rw]');if(!b||b.disabled)return;const a=b.dataset.rw,id=b.dataset.id;
if(a==='close'){closeModal();return}if(a==='modal-confirm'){submitModal();return}
if(a==='overview'){go('overview');return}if(a==='menu'){state.menu=!state.menu;$('#rw-app').dataset.menu=String(state.menu);return}
if(a==='projects'){projectDialog();return}if(a==='all-projects'){closeModal();go('overview');return}if(a==='enter-project'){switchProject(id);go('progress');return}
if(a==='new-project'){modal('添加项目',field('项目名称','rw-new-project-name')+field('源代码目录（可后补）','rw-new-project-path')+'<p class="rw-sub">仅添加预览中的项目，不读取或改动电脑目录。</p>','save-project');return}
if(a==='settings'){modal('工作台设置','<div class="rw-section-title">当前项目</div><p>'+esc(p().name)+'</p><code>'+esc(p().path)+'</code><hr class="rw-rule">'+button('日报与周报生成','schedule','clock-3')+button('知识维护','knowledge-settings','book-open')+'<p class="rw-sub">本次原型不连接真实仓库、聊天记录或自动化。离开后，笔记与操作数据不会永久保存。</p>');return}
if(a==='new-task'||a==='task'){taskDialog(a==='task'?id:null);return}
if(a==='toggle-done'){const t=p().tasks.find(x=>x.id===id);t.done=!t.done;render();tell(t.done?'已完成：'+t.name+'。详细过程保留在科研记录和日报中。':'已重新加入待办：'+t.name);remember('修改任务完成状态');return}
if(a==='toggle-done-list'){state.doneOpen=!state.doneOpen;render();return}
if(a==='prev-week'||a==='next-week'||a==='this-week'){state.week=a==='this-week'?0:state.week+(a==='next-week'?1:-1);render();return}
if(a==='open-note'){if(p().notes.some(n=>n.id===id))go('notes',id);else{go('notes');tell('这项任务还没有关联记录，可以直接新建。')}return}
if(a==='new-note'){const n={id:uid(),title:'',body:'',date:'2026-09-19',created:stamp(),updated:stamp(),source:'手动记录',comments:[]};p().notes.unshift(n);go('notes',n.id);state.mode='edit';render();$('#rw-edit-text')?.focus();return}
if(a==='open-report'){go('reports',id);return}if(a==='open-weekly'){state.reportType='weekly';go('reports','rw1');return}
if(a==='back'){go(state.view);return}
if(a==='mode-preview'||a==='mode-edit'){if(editor?.state==='final'&&a==='mode-edit')return;flush();state.mode=a==='mode-edit'?'edit':'preview';render();if(state.mode==='edit')$('#rw-edit-text')?.focus();remember('切换编辑预览');return}
if(a==='save-document'){flush();documentChanged();remember('保存记录');return}
if(a==='insert-code'){flush();state.mode='edit';render();const t=$('#rw-edit-text');t.focus();t.setSelectionRange(t.value.length,t.value.length);insertText('\n\n```python\n# 在这里写代码\n```\n');return}
if(a==='comment'){flush();modal('添加批注',(selectionQuote?'<blockquote>'+esc(selectionQuote)+'</blockquote>':'<p class="rw-sub">为整份文档添加批注；也可先选中预览文字。</p>')+'<label class="rw-field"><span>批注内容</span><textarea class="rw-input" id="rw-comment" rows="4" placeholder="写下想法或待核对的问题"></textarea></label>','save-comment','添加批注');return}
if(a==='confirm-report'){flush();modal('确认为正式版','<p>确认这份报告已核对。确认后不再被自动整理覆盖，需要修改时可转回草稿。</p>','confirm-report','确认正式版');return}
if(a==='reopen-report'){modal('修改正式版','<p>先将当前报告转回草稿，再进行编辑。修改完成后需要重新确认。</p>','reopen-report','转回草稿');return}
if(a==='export'){flush();modal('导出 Markdown','<p class="rw-sub">选择下方正文并复制，可直接保存为 .md 文件。</p><textarea id="rw-export" class="rw-input" rows="12" aria-label="Markdown 全文" readonly>'+esc((state.view==='notes'?'# '+(editor.title||'未命名记录')+'\n\n':'')+editor.body)+'</textarea>');$('#rw-export').select();return}
if(a==='schedule'||a==='knowledge-settings'){scheduleDialog(a==='schedule'?'all':'knowledge');return}
if(a==='generate'){generateDialog();return}
if(a==='sources'){sourcesDialog('report');return}
if(a==='source-report'){closeModal();go('reports',id);return}
if(a==='source-note'){const pid=b.dataset.projectId;closeModal();switchProject(pid);go('notes',id);return}
if(a==='knowledge-sources'){sourcesDialog('knowledge');return}
if(a==='edit-knowledge'){const k=p().knowledge.find(x=>x.id===state.knowledge);modal('编辑 · '+esc(k.title),'<label class="rw-field"><span>Markdown 正文</span><textarea id="rw-knowledge-text" class="rw-input" rows="14">'+esc(k.body)+'</textarea></label><p class="rw-sub">手动内容会保留；后续整理涉及修改时再确认。</p>','save-knowledge');return}
if(a==='knowledge-updates'){const k=p().knowledge.find(x=>x.id===state.knowledge);modal('知识更新 · 待确认','<p class="rw-sub">'+esc(k.title)+' · '+(k.manual?'检测到人工修改，先核对再更新':'示例补充，不直接改写原文')+'</p><div class="rw-compare"><div><span class="rw-sub">当前内容</span><p>'+esc(k.body.slice(0,180))+'</p></div><div><span class="rw-sub">建议追加</span><p>固定输入条件后再比较结果，区分代码已完成与实测已验证；保留失败样例与实验条件。</p></div></div><p class="rw-sub">取消即保持现状，不阻塞其他操作。</p>','accept-knowledge','接受补充');return}
if(a==='new-paper'||a==='edit-paper'){paperDialog(a==='new-paper');return}
if(a==='open-paper'){go('literature',id);return}
if(a==='paper-read'){const paper=p().papers.find(x=>x.id===state.detail);paper.read=!paper.read;render();tell(paper.read?'已标记为已读。':'已标记为待阅读。');return}
if(a==='paper-note'){const paper=p().papers.find(x=>x.id===state.detail);modal('阅读笔记','<label class="rw-field"><span>Markdown 正文</span><textarea class="rw-input" id="rw-paper-note" rows="12">'+esc(paper.note)+'</textarea></label>','save-paper-note');return}
if(a==='remove-paper'){modal('移出本项目','<p>移出当前项目的文献列表，不删除原文或本地文件。</p>','remove-paper','移出');return}
});
root.addEventListener('dblclick',e=>{if(e.target.closest('#rw-preview')&&editor?.state!=='final'&&!window.getSelection()?.toString()){state.mode='edit';render();$('#rw-edit-text')?.focus()}});
root.addEventListener('input',e=>{if(e.target.id==='rw-edit-text'||e.target.id==='rw-edit-title'){flush();documentChanged()}if(e.target.id==='rw-paper-search'){state.query=e.target.value;$('#rw-paper-list').innerHTML=paperRows(p().papers.filter(x=>x.title.toLowerCase().includes(state.query.toLowerCase())));icons()}});
root.addEventListener('change',e=>{if(e.target.id==='rw-report-scope'){state.reportScope=e.target.value;render();remember('筛选报告项目')}if(e.target.id==='rw-report-status'){state.reportStatus=e.target.value;render()}});
root.addEventListener('mouseup',()=>{const s=window.getSelection();if(s&&!s.isCollapsed&&$('#rw-editor-body')?.contains(s.anchorNode))selectionQuote=s.toString().slice(0,600)});
root.addEventListener('paste',e=>{if(!editor||editor.state==='final'||!$('#rw-overlay').hidden)return;const files=Array.from(e.clipboardData?.items||[]).filter(x=>x.kind==='file').map(x=>x.getAsFile()).filter(Boolean);if(files.length){e.preventDefault();importImages(files);return}if(e.target.id==='rw-edit-title')return;const text=e.clipboardData?.getData('text/plain');if(!text)return;if(e.target.id==='rw-edit-text'||e.target.closest('#rw-editor-body')||e.target.closest('[data-rw=mode-preview]')){e.preventDefault();insertText(text,/^(#{1,6}\s|```|[-*]\s)|\*\*[^*]+\*\*/m.test(text)||state.mode==='preview')}});
root.addEventListener('dragover',e=>{if(editor&&editor.state!=='final'&&e.target.closest('#rw-editor-body')){e.preventDefault();$('#rw-editor-body').classList.add('rw-drag')}});
root.addEventListener('dragleave',e=>{if(editor&&!$('#rw-editor-body')?.contains(e.relatedTarget))$('#rw-editor-body')?.classList.remove('rw-drag')});
root.addEventListener('drop',e=>{if(editor&&editor.state!=='final'&&e.target.closest('#rw-editor-body')){e.preventDefault();$('#rw-editor-body').classList.remove('rw-drag');importImages(e.dataTransfer.files)}});
root.addEventListener('keydown',e=>{if(e.target.closest('#rw-git-host'))return;if(!$('#rw-overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const nodes=Array.from($('#rw-overlay').querySelectorAll('button:not(:disabled),input,textarea,select,a[href]'));const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}return}if((e.ctrlKey||e.metaKey)&&e.key==='s'&&editor){e.preventDefault();flush();documentChanged()}if(e.key==='Escape'&&state.menu){state.menu=false;$('#rw-app').dataset.menu='false'}});
root.addEventListener('rw-git-action',e=>{remember(e.detail.action);tell('代码操作已在示例仓库中完成，不改动真实 Git。')});
render();
})();
</script>
</div>
