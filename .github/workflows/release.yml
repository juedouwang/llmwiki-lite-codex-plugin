name: Release LLM Wiki Lite

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.12.0

      - name: Validate release version
        env:
          PYTHONUTF8: '1'
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('plugins/llmwiki-lite/.codex-plugin/plugin.json', encoding='utf-8'))['version'])")
          CLAUDE_VERSION=$(python -c "import json; print(json.load(open('plugins/llmwiki-lite/.claude-plugin/plugin.json', encoding='utf-8'))['version'])")
          test "$TAG_NAME" = "v$VERSION"
          test "$CLAUDE_VERSION" = "$VERSION"
          ruff check plugins/llmwiki-lite/scripts plugins/llmwiki-lite/opencode plugins/llmwiki-lite/tests
          python -B plugins/llmwiki-lite/tests/smoke_test.py

      - name: Extract release notes from CHANGELOG.md
        env:
          PYTHONUTF8: '1'
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["TAG_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"(?ms)^## {re.escape(version)}\b[^\n]*\n(.*?)(?=^## |\Z)", text)
          if not match or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "LLM Wiki Lite ${{ github.ref_name }}" --notes-file release-notes.md

  desktop:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build the desktop app
        shell: powershell
        run: ./desktop/build.ps1 -Python python

      - name: Run desktop tests
        shell: powershell
        env:
          PYTHONUTF8: '1'
        run: |
          & "$env:LOCALAPPDATA\LLMWikiDesktop\build-env\Scripts\python.exe" -B -m unittest discover -s desktop -p test_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the release zip
        shell: powershell
        run: ./desktop/package.ps1 -Version "${{ github.ref_name }}"

      - name: Attach the zip and its SHA-256 to the release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem desktop/release -File | ForEach-Object FullName
          gh release upload "${{ github.ref_name }}" @files --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
