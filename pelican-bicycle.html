<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d7f1ed;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }
    .scene {
      position: relative;
      width: min(100vw, 1500px);
      aspect-ratio: 5 / 3;
      max-height: 100vh;
      overflow: hidden;
      background: #b9e8e5;
    }
    svg { display: block; width: 100%; height: 100%; }
    .caption {
      position: absolute;
      left: 4%;
      top: 5%;
      color: #245d65;
      font-size: clamp(12px, 1.5vw, 20px);
      font-weight: 800;
      letter-spacing: .17em;
      text-shadow: 0 2px 0 #ffffff80;
      pointer-events: none;
    }
    .cloud-a { animation: drift-a 18s ease-in-out infinite alternate; }
    .cloud-b { animation: drift-b 23s ease-in-out infinite alternate; }
    .lane { animation: lanes 1.1s linear infinite; }
    .bike-bob { animation: bob .55s ease-in-out infinite alternate; }
    .rear-wheel {
      transform-origin: 335px 438px;
      transform-box: view-box;
      animation: spin 1.1s linear infinite;
    }
    .front-wheel {
      transform-origin: 665px 438px;
      transform-box: view-box;
      animation: spin 1.1s linear infinite;
    }
    .wing {
      transform-origin: 449px 246px;
      transform-box: view-box;
      animation: wingbeat .55s ease-in-out infinite alternate;
    }
    .tail {
      transform-origin: 375px 265px;
      transform-box: view-box;
      animation: tail-wag .55s ease-in-out infinite alternate;
    }
    .pouch { animation: pouch-bob 1.1s ease-in-out infinite; }
    .dust-a { animation: dust 1.1s ease-out infinite; }
    .dust-b { animation: dust 1.1s ease-out .55s infinite; }
    @keyframes drift-a { to { transform: translateX(85px); } }
    @keyframes drift-b { to { transform: translateX(-65px); } }
    @keyframes lanes { to { transform: translateX(-180px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px); } }
    @keyframes wingbeat { to { transform: rotate(-11deg); } }
    @keyframes tail-wag { to { transform: rotate(5deg); } }
    @keyframes pouch-bob { 50% { transform: translateY(3px); } }
    @keyframes dust {
      0% { opacity: 0; transform: translate(0, 0) scale(.6); }
      25% { opacity: .5; }
      100% { opacity: 0; transform: translate(-45px, -24px) scale(1.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      svg * { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="caption">A SUNNY LITTLE RIDE</div>
    <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">鹈鹕骑自行车</title>
      <desc id="scene-desc">戴着头盔的鹈鹕在阳光明媚的海边骑自行车，车轮、双腿、翅膀和道路持续运动。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#9bdedc"/>
          <stop offset="1" stop-color="#f9efd1"/>
        </linearGradient>
        <linearGradient id="sea" x2="0" y2="1">
          <stop stop-color="#8ccfce"/>
          <stop offset="1" stop-color="#b7e6db"/>
        </linearGradient>
        <linearGradient id="body" x2="0" y2="1">
          <stop stop-color="#fffdf0"/>
          <stop offset="1" stop-color="#e9dfc4"/>
        </linearGradient>
        <linearGradient id="pouch-fill" x2="0" y2="1">
          <stop stop-color="#ffc36f"/>
          <stop offset="1" stop-color="#e58764"/>
        </linearGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
      </defs>

      <!-- Coast and sky -->
      <rect width="1000" height="600" fill="url(#sky)"/>
      <circle cx="802" cy="100" r="53" fill="#fff5b1" opacity=".55"/>
      <circle cx="802" cy="100" r="39" fill="#fff4b5"/>
      <g class="cloud-a" fill="#fffdf1" opacity=".88">
        <ellipse cx="200" cy="121" rx="65" ry="19"/>
        <circle cx="172" cy="109" r="23"/>
        <circle cx="210" cy="98" r="31"/>
        <circle cx="244" cy="110" r="21"/>
      </g>
      <g class="cloud-b" fill="#fffdf1" opacity=".72">
        <ellipse cx="709" cy="178" rx="54" ry="15"/>
        <circle cx="684" cy="165" r="20"/>
        <circle cx="720" cy="157" r="24"/>
        <circle cx="748" cy="169" r="17"/>
      </g>
      <path d="M0 360 Q150 322 293 366 T600 356 T1000 362 V514 H0Z" fill="#e5e3bd"/>
      <path d="M0 398 Q145 372 292 396 T570 386 T1000 390 V514 H0Z" fill="#c9ddbb"/>
      <path d="M0 433 Q225 420 467 432 T1000 425 V514 H0Z" fill="url(#sea)"/>
      <g fill="none" stroke="#f4f6dc" stroke-width="4" opacity=".64" stroke-linecap="round">
        <path d="M45 456h74 M222 477h103 M745 462h111 M870 488h83"/>
      </g>
      <path d="M0 487 Q205 468 397 490 T769 483 T1000 490 V522 H0Z" fill="#add4a9"/>
      <g fill="#7daf88" opacity=".7">
        <path d="M85 490l7-22 6 23z M101 490l5-14 5 14z M806 491l7-24 7 24z M827 493l4-15 6 15z"/>
        <path d="M923 490l6-24 7 24z M939 489l5-15 4 15z"/>
      </g>

      <!-- Road -->
      <path d="M0 515H1000V600H0Z" fill="#6d8585"/>
      <path d="M0 515H1000" stroke="#f8e6ae" stroke-width="9"/>
      <path d="M0 528H1000" stroke="#506e70" stroke-width="3" opacity=".55"/>
      <g class="lane" fill="#dce9dc" opacity=".78">
        <rect x="-180" y="568" width="84" height="7" rx="3"/>
        <rect x="0" y="568" width="84" height="7" rx="3"/>
        <rect x="180" y="568" width="84" height="7" rx="3"/>
        <rect x="360" y="568" width="84" height="7" rx="3"/>
        <rect x="540" y="568" width="84" height="7" rx="3"/>
        <rect x="720" y="568" width="84" height="7" rx="3"/>
        <rect x="900" y="568" width="84" height="7" rx="3"/>
        <rect x="1080" y="568" width="84" height="7" rx="3"/>
      </g>
      <ellipse cx="500" cy="528" rx="280" ry="12" fill="#304c50" opacity=".3" filter="url(#soft-shadow)"/>
      <g fill="#e4d1aa">
        <circle class="dust-a" cx="253" cy="515" r="9"/>
        <circle class="dust-b" cx="269" cy="519" r="6"/>
      </g>

      <g class="bike-bob">
        <!-- Spinning wheels -->
        <g class="rear-wheel">
          <circle cx="335" cy="438" r="84" fill="#d7e7d3" opacity=".15"/>
          <circle cx="335" cy="438" r="84" fill="none" stroke="#254b52" stroke-width="15"/>
          <circle cx="335" cy="438" r="73" fill="none" stroke="#f7f3dc" stroke-width="3"/>
          <g stroke="#eff1df" stroke-width="2" opacity=".75">
            <path d="M335 365v146 M262 438h146 M283 386l104 104 M283 490l104-104"/>
            <path d="M307 370l56 136 M267 410l136 56 M267 466l136-56 M307 506l56-136"/>
          </g>
          <circle cx="335" cy="365" r="6" fill="#eea876"/>
          <circle cx="335" cy="438" r="12" fill="#254b52"/>
        </g>
        <g class="front-wheel">
          <circle cx="665" cy="438" r="84" fill="#d7e7d3" opacity=".15"/>
          <circle cx="665" cy="438" r="84" fill="none" stroke="#254b52" stroke-width="15"/>
          <circle cx="665" cy="438" r="73" fill="none" stroke="#f7f3dc" stroke-width="3"/>
          <g stroke="#eff1df" stroke-width="2" opacity=".75">
            <path d="M665 365v146 M592 438h146 M613 386l104 104 M613 490l104-104"/>
            <path d="M637 370l56 136 M597 410l136 56 M597 466l136-56 M637 506l56-136"/>
          </g>
          <circle cx="665" cy="365" r="6" fill="#eea876"/>
          <circle cx="665" cy="438" r="12" fill="#254b52"/>
        </g>

        <!-- Bicycle frame -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M335 438 L469 332 L500 437 Z M469 332 L594 331 L500 437 M594 331 L665 438" stroke="#18555b" stroke-width="17"/>
          <path d="M335 438 L469 332 L500 437 Z M469 332 L594 331 L500 437 M594 331 L665 438" stroke="#38a79d" stroke-width="11"/>
          <path d="M594 331 L616 298 L649 298 L657 312" stroke="#254b52" stroke-width="10"/>
          <path d="M642 297h15" stroke="#e89963" stroke-width="11"/>
          <path d="M465 332 L456 310" stroke="#254b52" stroke-width="8"/>
        </g>
        <path d="M427 313 Q453 303 487 311 Q489 320 475 322 H439 Q427 321 427 313Z" fill="#254b52"/>
        <circle cx="500" cy="437" r="18" fill="#1e5c60" stroke="#c7ded1" stroke-width="4"/>
        <g stroke="#214c51" stroke-width="8" stroke-linecap="round">
          <line id="arm-far" x1="500" y1="437" x2="500" y2="437"/>
          <line id="arm-near" x1="500" y1="437" x2="500" y2="437"/>
        </g>

        <!-- Far leg -->
        <path id="leg-far" fill="none" stroke="#c97643" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Bird tail and body -->
        <g class="tail" fill="#f7efdc" stroke="#d4cbb7" stroke-width="2">
          <path d="M391 271 Q356 244 327 246 Q344 263 382 286Z"/>
          <path d="M393 279 Q348 269 322 281 Q350 289 390 296Z"/>
          <path d="M394 286 Q358 300 340 317 Q375 309 403 300Z"/>
        </g>
        <path d="M485 247 C525 233 557 273 540 309 C525 330 486 329 462 314 C418 323 379 301 375 263 C372 224 409 197 453 202 C476 205 491 221 485 247Z" fill="url(#body)" stroke="#d2cbb5" stroke-width="4"/>
        <path d="M505 252 C531 229 550 209 535 175 C521 146 530 124 553 120 C580 118 588 141 576 165 C567 182 562 204 568 223 C574 247 557 276 535 285Z" fill="url(#body)" stroke="#d2cbb5" stroke-width="4"/>
        <path d="M390 269 Q420 313 477 304" fill="none" stroke="#d7d0b9" stroke-width="3" opacity=".7"/>

        <!-- Wing and little feathers -->
        <g class="wing">
          <path d="M395 232 Q431 209 479 240 Q475 281 442 290 Q411 284 395 253Z" fill="#f4edda" stroke="#d4cbb7" stroke-width="3"/>
          <path d="M405 250 Q438 265 471 250 M409 263 Q437 280 462 266" fill="none" stroke="#d6ceba" stroke-width="3" stroke-linecap="round"/>
          <path d="M421 283 Q425 296 438 301 M437 287 Q445 298 455 299" fill="none" stroke="#e9dfc9" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- Pelican head, bill and pouch -->
        <path class="pouch" d="M571 151 Q641 146 738 155 Q707 200 652 220 Q601 239 574 183Z" fill="url(#pouch-fill)" stroke="#d47753" stroke-width="3"/>
        <ellipse cx="547" cy="137" rx="42" ry="40" fill="url(#body)" stroke="#d2cbb5" stroke-width="4"/>
        <path d="M574 139 Q658 126 746 147 Q750 151 743 155 Q668 159 573 157Z" fill="#f39c54" stroke="#c86f45" stroke-width="3"/>
        <path d="M591 146 Q657 140 719 149" fill="none" stroke="#ffd08a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="559" cy="127" r="5.5" fill="#254b52"/>
        <circle cx="560.5" cy="125.5" r="1.7" fill="white"/>
        <path d="M513 118 Q519 84 548 80 Q578 79 587 113 L576 123 Q544 112 513 118Z" fill="#37a79c" stroke="#206e72" stroke-width="3"/>
        <path d="M526 104 Q548 95 570 104" fill="none" stroke="#83d5c1" stroke-width="5" stroke-linecap="round"/>
        <path d="M586 111 Q598 113 602 121 Q589 124 577 121" fill="#206e72"/>
        <path d="M515 118 Q521 164 545 170" fill="none" stroke="#27787b" stroke-width="3"/>

        <!-- Near leg, feet and pedals -->
        <path id="leg-near" fill="none" stroke="#e68c4d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="foot-far">
          <rect x="-24" y="5" width="48" height="8" rx="4" fill="#234c52"/>
          <path d="M-13 0 Q-4 -11 9 -4 L23 3 Q17 10 -4 8Z" fill="#cb7845" stroke="#a75e3f" stroke-width="2"/>
        </g>
        <g id="foot-near">
          <rect x="-24" y="5" width="48" height="8" rx="4" fill="#234c52"/>
          <path d="M-13 0 Q-3 -12 11 -5 L26 3 Q17 11 -5 8Z" fill="#ed9651" stroke="#c97342" stroke-width="2"/>
        </g>
        <circle cx="500" cy="437" r="8" fill="#f3d48e" stroke="#1e5c60" stroke-width="3"/>
      </g>
    </svg>
  </main>
  <script>
    (() => {
      const nearLeg = document.getElementById('leg-near');
      const farLeg = document.getElementById('leg-far');
      const nearFoot = document.getElementById('foot-near');
      const farFoot = document.getElementById('foot-far');
      const nearArm = document.getElementById('arm-near');
      const farArm = document.getElementById('arm-far');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let startTime;

      function positionLeg(path, hipX, hipY, footX, footY, bend) {
        const kneeX = (hipX + footX) / 2 + bend;
        const kneeY = (hipY + footY) / 2 - 9;
        path.setAttribute('d', `M${hipX} ${hipY} L${kneeX.toFixed(1)} ${kneeY.toFixed(1)} L${footX.toFixed(1)} ${footY.toFixed(1)}`);
      }

      function pose(angle) {
        const dx = 29 * Math.cos(angle);
        const dy = 29 * Math.sin(angle);
        const nearX = 500 + dx;
        const nearY = 437 + dy;
        const farX = 500 - dx;
        const farY = 437 - dy;
        positionLeg(nearLeg, 466, 294, nearX, nearY, 19);
        positionLeg(farLeg, 496, 289, farX, farY, -21);
        nearFoot.setAttribute('transform', `translate(${nearX.toFixed(1)} ${nearY.toFixed(1)})`);
        farFoot.setAttribute('transform', `translate(${farX.toFixed(1)} ${farY.toFixed(1)})`);
        nearArm.setAttribute('x2', nearX.toFixed(1));
        nearArm.setAttribute('y2', nearY.toFixed(1));
        farArm.setAttribute('x2', farX.toFixed(1));
        farArm.setAttribute('y2', farY.toFixed(1));
      }

      function frame(time) {
        if (reducedMotion.matches) {
          pose(0.7);
          startTime = undefined;
          return;
        }
        if (startTime === undefined) startTime = time;
        pose(0.7 + (time - startTime) * Math.PI * 2 / 1100);
        requestAnimationFrame(frame);
      }

      pose(0.7);
      if (!reducedMotion.matches) requestAnimationFrame(frame);
      reducedMotion.addEventListener('change', () => {
        if (reducedMotion.matches) pose(0.7);
        else requestAnimationFrame(frame);
      });
    })();
  </script>
</body>
</html>
